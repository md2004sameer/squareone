spring.application.name=squareone
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/squareone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.default-schema=${DATABASE_SCHEMA:PUBLIC}
spring.flyway.schemas=${DATABASE_SCHEMA:PUBLIC}
spring.flyway.placeholders.appSchema=${DATABASE_SCHEMA:PUBLIC}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:PUBLIC}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.servlet.session.timeout=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.max-age=14d
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
spring.session.timeout=14d
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=${DATABASE_SCHEMA:PUBLIC}.SPRING_SESSION
