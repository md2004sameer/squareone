# HTTPS is terminated by the hosting platform's reverse proxy.
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=native
spring.sql.init.mode=never
# Production must use an explicitly configured external database.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.default-schema=${DATABASE_SCHEMA:squareone}
spring.flyway.schemas=${DATABASE_SCHEMA:squareone}
spring.flyway.placeholders.appSchema=${DATABASE_SCHEMA:squareone}
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:squareone}
spring.session.jdbc.table-name=${DATABASE_SCHEMA:squareone}.SPRING_SESSION
