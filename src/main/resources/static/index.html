<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#20211e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A quiet space for your notes and ideas." />
    <title>Squareone — your space to think</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/stylesdocs.css" />
    <script src="/appdocs.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Document navigation">
        <a class="brand" href="/" aria-label="Squareone home">
          <span class="brand-mark" aria-hidden="true">s</span>
          <span>squareone</span>
        </a>

        <button class="new-document-button" id="new-document" type="button">
          <span aria-hidden="true">＋</span>
          <span>New document</span>
          <span class="shortcut" aria-hidden="true">⌘ N</span>
        </button>

        <div class="section-label">
          <span>Your space</span>
          <span class="document-count" id="document-count">0</span>
        </div>

        <label class="search-box">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.8" cy="8.8" r="5.8"></circle>
            <path d="m13.2 13.2 4 4"></path>
          </svg>
          <input id="search" type="search" placeholder="Find a document..." autocomplete="off" />
          <span class="search-shortcut" aria-hidden="true">/</span>
        </label>

        <nav class="document-list" id="document-list" aria-label="Your documents"></nav>

        <div class="sidebar-footer">
          <span class="online-dot" aria-hidden="true"></span>
          <span>Everything in its place.</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            <span class="breadcrumb-root">Your space</span>
            <span class="breadcrumb-divider" aria-hidden="true">/</span>
            <span class="breadcrumb-current" id="breadcrumb-title">Welcome</span>
          </div>
          <div class="topbar-actions">
            <span class="save-status" id="save-status" role="status" aria-live="polite">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="save-status-text">All changes saved</span>
            </span>
            <button class="icon-button delete-button" id="delete-document" type="button" aria-label="Delete document" title="Delete document" disabled>
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4.5 6h11M8 6V4.5h4V6m2.5 0-.7 10H6.2L5.5 6m3 3v4m3-4v4"></path>
              </svg>
            </button>
          </div>
        </header>

        <section class="editor-wrap" aria-label="Document editor">
          <div class="welcome-state" id="welcome-state">
            <div class="welcome-art" aria-hidden="true">
              <span class="art-sun"></span>
              <span class="art-line art-line-one"></span>
              <span class="art-line art-line-two"></span>
              <span class="art-line art-line-three"></span>
              <span class="art-leaf"></span>
            </div>
            <p class="eyebrow">A little room to think</p>
            <h1>Start anywhere.</h1>
            <p class="welcome-copy">A note, a thought, a plan for later.<br />Make a little space for whatever's on your mind.</p>
            <button class="primary-button" id="welcome-create" type="button">
              <span aria-hidden="true">＋</span> Write your first note
            </button>
            <p class="keyboard-hint">or press <kbd>⌘</kbd> <kbd>N</kbd></p>
          </div>

          <article class="editor" id="editor" hidden>
            <div class="document-meta">
              <span class="meta-icon" aria-hidden="true">✳</span>
              <span id="document-date"></span>
            </div>
            <input
              class="title-input"
              id="title-input"
              type="text"
              placeholder="Untitled"
              aria-label="Document title"
              maxlength="160"
            />
            <div class="editor-divider"></div>
            <textarea
              class="content-input"
              id="content-input"
              placeholder="Begin with a thought..."
              aria-label="Document content"
              spellcheck="true"
            ></textarea>
            <div class="word-count" id="word-count">0 words</div>
          </article>
        </section>
        <div class="toast" id="toast" role="alert" aria-live="assertive"></div>
      </main>
    </div>
  </body>
</html>
